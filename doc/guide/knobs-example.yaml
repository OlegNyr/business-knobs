# ПРИМЕР исходного файла параметров сервиса. Ключи условные — это образец формы,
# а не список параметров настоящего сервиса.
#
# Этот файл пишет разработчик. Из него сборка генерирует по файлу на стенд:
#   generated/knobs-dev.json, knobs-test.json, knobs-prod.json
# В сгенерированном файле ключ записан целиком, значение выбрано для своего стенда.
#
# Как читать «лесенку»: вложенность — это сегменты ключа через точку. Слова name,
# description, type, list, allowed, min, max, pattern, format, default, rules,
# deleted зарезервированы: сегментом ключа они быть не могут. Узел, в котором есть хотя бы
# одно такое слово, — параметр; всё, что выше него, — путь ключа.
#
# ТИП — boolean, string, integer, double, duration, date. Писать его не обязательно: он
# выводится из значения.
#   true / false          boolean
#   2                     integer
#   2.5                   double
#   10s, 500ms, 5m        duration
#   2026-11-01            date
#   любой другой текст    string
#   [jpg, png]            список — по типу элементов
# Тип обязателен там, где вывести его не из чего: значение — подстановка ${ИМЯ} либо пустой
# список. Без него генерация падает. Его же пишут, когда вывод не тот: дробный параметр со
# значением 10 без type станет целым, а текст вида «10s» — длительностью.
#
# ГДЕ ДЕЙСТВУЕТ ЗНАЧЕНИЕ
#   default — значение везде: все сервисы, все стенды.
#   rules   — правила. Записываются одним из двух способов:
#               rules:              список сразу — правила для всех стендов
#                 - value: …
#               rules:              по стендам: dev, test, prod — только для своего стенда,
#                 dev:              all — для всех. От стенда зависит, в какой
#                   - value: …      сгенерированный файл правило попадёт
#                 all:
#                   - value: …
#   Правило — это value и, если нужно, when со списком путей. Места в пути — измерения из
#   секции dimensions в том порядке, в каком они там объявлены (service не в счёт); здесь
#   это /ЦОД/арендатор/сегмент/канал. Сервис в пути не пишется: правило всегда относится к
#   сервису этого файла.
#               /dc1          ЦОД dc1, всё остальное — любое
#               /dc1/*/VIP    ЦОД dc1, сегмент VIP
#               /*/*/VIP      любой ЦОД, сегмент VIP: * — «любой»
#             Хвост из звёздочек не пишется, последняя часть пути звёздочкой не бывает. Правило
#             без when действует везде. Побеждает самый точный подошедший путь: точнее тот, у
#             кого последняя названная часть дальше, при равенстве — у кого названо больше
#             частей: /dc2/*/VIP, /*/*/VIP, /dc2. Правила стенда сильнее общих.
#             Тот же порядок — порядок точности: библиотека берёт его из файла стенда.
#             Новое измерение — в конец списка, иначе короткие пути сдвинутся. Именованная
#             форма when: [{segment: VIP}] — по именам измерений, порядок ей не важен.
#   ИСКЛЮЧЕНИЕ — правило для всех сервисов: звёздочка перед слешем, "*/dc2". Таких
#   параметров мало: это общий параметр, который читают несколько сервисов. Путь со
#   звёздочкой в начале пишется в кавычках — без них YAML принимает * за ссылку и файл
#   не разбирается.
#   Стенд (dev, test, prod) в путь не входит — он задаётся ключом внутри rules.
#   Параметр, у которого для стенда нет ни default, ни подходящего правила, в файл этого
#   стенда не попадает.

service: orders

# Стенды, для которых генерируются файлы.
stands: [dev, test, prod]

# Измерения, по которым правило выбирает значение.
#   kind  — кто задаёт значения: code (этот файл), stand (администратор на стенде),
#           registry (другой справочник админки)
#   Порядок объявления — порядок мест в пути правила.
dimensions:
  service:         { kind: registry }
  dc:              { kind: stand }
  tenant:          { kind: stand }
  segment:         { kind: code,     values: [MASS, PREMIUM, PRIVATE, VIP] }
  channel:         { kind: registry }

parameters:
  app:
    routing:
      segment:
        # Флаг: самый простой случай — одно значение везде.
        call-enabled:
          name: Запрашивать сегмент клиента в CRM
          default: true

      # Параметр удалён: код его больше не читает. Запись остаётся, пока админки всех
      # стендов не загрузят файл с пометкой.
      project-enabled:
        deleted: true

    crm:
      # Длительность с границами и своим значением на стенде dev. Пишется как в настройках
      # Spring: 500ms, 10s, 5m, 2h. Единица измерения — в значении, а не в ключе и не в названии.
      read-timeout:
        name: Таймаут чтения CRM
        description: Сколько ждём ответа CRM, прежде чем обслужить клиента как массового
        min: 100ms
        max: 60s
        default: 10s
        rules:
          dev:
            - value: 60s              # на dev ждём дольше: стенд CRM медленный
          all:
            - when: [/dc2]            # из второго ЦОД до CRM дальше
              value: 15s

      # Целое число с границами.
      retry-count:
        name: Сколько раз повторять запрос к CRM
        min: 0
        max: 5
        default: 2
        rules:
          - when: [/dc2]        # из второго ЦОД повторяем на раз больше
            value: 3

      # Адрес, свой на каждом стенде: значение — подстановка, её разрешают при загрузке.
      # Тип здесь обязателен: из ${ИМЯ} его не вывести.
      # default нет, правила есть только для dev и test — значит, в файл prod параметр не
      # попадёт: на проде CRM один, адрес остаётся в переменной окружения. Адреса CRM для
      # разных арендаторов администратор задаёт в админке правилом, в файле их нет.
      base-url:
        name: Адрес CRM
        type: string
        format: url
        rules:
          dev:
            - value: ${APP_CRM_URL}
          test:
            - value: ${APP_CRM_URL}

    queue:
      # Выбор из списка.
      overflow-policy:
        name: Что делать с обращением, не дождавшимся оператора
        allowed: [requeue, fallback, close]
        default: fallback

    support:
      # Текст с правилом по сегменту клиента: общее правило действует на всех стендах, а на
      # dev его перекрывает правило стенда. Сегмент — третье место пути; ЦОД и арендатор здесь
      # любые, поэтому на их местах стоят звёздочки.
      wait-notice:
        name: Текст клиенту при ожидании оператора
        default: Оператор скоро подключится
        rules:
          all:
            - when: [/*/*/VIP, /*/*/PRIVATE]
              value: Ваш персональный менеджер уже подключается
          dev:
            - value: "[dev] Оператор скоро подключится"

    survey:
      # Дата без времени, в виде ГГГГ-ММ-ДД.
      start-date:
        name: Дата, с которой клиенту показывается опрос оценки обслуживания
        default: 2026-11-01
        rules:
          dev:
            - value: 2026-10-01

    maintenance:
      # ИСКЛЮЧЕНИЕ: правило для всех сервисов — звёздочка перед слешем, путь в кавычках.
      # На проде во втором ЦОД режим обслуживания включён у всех сервисов, читающих этот
      # параметр, а не только у orders.
      enabled:
        name: Режим обслуживания — клиенту показывается заглушка
        default: false
        rules:
          prod:
            - when: ["*/dc2"]
              value: true

    media:
      # Список значений; на dev разрешаем больше.
      allowed-extensions:
        name: Расширения файлов, которые клиент может прислать
        default: [jpg, png, pdf]
        rules:
          dev:
            - value: [jpg, png, pdf, txt, zip]
