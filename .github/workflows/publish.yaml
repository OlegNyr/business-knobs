name: publish

# Релиз = тег vX.Y.Z на коммите, где версия в pom.xml — X.Y.Z-SNAPSHOT. CI:
#   1) проверяет, что тег совпадает с версией pom без -SNAPSHOT;
#   2) ставит версию X.Y.Z (только в рабочей копии CI — в репозиторий не коммитится);
#   3) собирает, подписывает и выкладывает модули в Maven Central (Central Portal) с автопубликацией;
#   4) создаёт GitHub Release.
# Пример (business-knobs-example) — отдельный проект вне реактора, в Central не уходит.
#
# Секреты репозитория (Settings -> Secrets and variables -> Actions) — те же, что у adoct:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD — user token из central.sonatype.com;
#   SIGNING_KEY — armored GPG-приватный ключ (весь блок целиком);
#   SIGNING_PASSWORD — passphrase ключа.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish-central:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-java кладёт в settings.xml сервер central с кредами из переменных окружения и
      # импортирует ключ GPG в агент раннера.
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.SIGNING_KEY }}

      - name: Resolve version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION="$(sh mvnw -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$POM_VERSION" != "$VERSION-SNAPSHOT" ]; then
            echo "::error::Тег $GITHUB_REF_NAME (=$VERSION) не совпадает с версией pom $POM_VERSION (ожидается $VERSION-SNAPSHOT)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set release version
        run: sh mvnw -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
        run: sh mvnw -B -ntp -P quality,release -Dcentral.autoPublish=true clean deploy

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: business-knobs ${{ env.VERSION }}
          body: |
            Артефакты в Maven Central (группа `io.github.olegnyr`, версия `${{ env.VERSION }}`):
            `business-knobs-api`, `business-knobs-impl`, `business-knobs-spring-boot`,
            `business-knobs-maven-plugin`.

            Что изменилось — CHANGELOG.md.
