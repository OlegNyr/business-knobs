name: build

# Сборка, тесты и проверки качества на каждый push и pull request. Плюс сборка артефактов выкладки
# без подписи — чтобы поломка Javadoc или дескриптора плагина всплыла до тега, а не на релизе.
on:
  push:
    branches: ['**']
  pull_request: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # sh mvnw — не зависит от флага исполняемости при checkout. install — чтобы пример ниже
      # нашёл библиотеку и плагин в локальном репозитории раннера, как их найдёт сервис.
      - name: Build, test, quality
        run: sh mvnw -B -ntp -P quality,release -Dgpg.skip clean install

      # Пример — отдельный проект-потребитель: подключает библиотеку и плагин по координатам.
      - name: Example without Spring
        run: sh mvnw -B -ntp -f business-knobs-example/pom.xml clean verify
